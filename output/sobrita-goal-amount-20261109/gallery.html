<main>
<h1>물건 없이도 만들 수 있는 금액 목표</h1>
<p>실제 Flutter 구현 화면을 예시 데이터로 렌더링했습니다. 통화를 KRW로 설정한 테스트 예시이며, 사용자의 통화나 잔액을 바꾸지 않습니다.</p>
<section>
<figure><figcaption><h2>목표 종류 선택</h2><p>금액 목표와 사고 싶은 물건을 같은 단계에서 선택합니다.</p></figcaption><a href="02-goal-type-choice-ko.png"><img src="02-goal-type-choice-ko.png" alt="금액 목표와 사고 싶은 물건 선택 화면"></a></figure>
<figure><figcaption><h2>1억 모으기 설정</h2><p>사진·링크 없이 이름과 금액을 입력합니다. 시작 금액과 날짜는 선택입니다.</p></figcaption><a href="03-amount-goal-editor-ko.png"><img src="03-amount-goal-editor-ko.png" alt="1억 원 목표와 시작 금액 천만 원을 입력한 금액 목표 화면"></a></figure>
<figure><figcaption><h2>기존 방 아래의 목표 카드</h2><p>캐릭터와 방을 유지하고, 목표 아이콘과 10% 진행률을 표시합니다.</p></figcaption><a href="04-home-amount-goal-ko.png"><img src="04-home-amount-goal-ko.png" alt="캐릭터 방 아래에 1억 모으기 목표를 표시하는 홈 화면"></a></figure>
</section>
