  ;(function() {
    // 错误监控对象
    var ErrorMonitor = {
      init: function() {
        this.monitorResourceError();
        this.monitorScriptError();
        this.monitorUnhandledRejection();
        this.monitorResourceTimeout();
      },

      // 发送错误数据
      sendErrorData: function(errorData, url) {
        var xhr = new XMLHttpRequest();
        if (url) {
          url += (url.indexOf('?') === -1 ? '?' : '&') + '_time=' + new Date().getTime();
        }
        var path = '' + '/api' + (url || '/client_error')
        xhr.open(url ? 'GET' : 'POST', path, true);
        xhr.setRequestHeader('x-requested-with', 'XMLHttpRequest');
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onerror = function() {
          console.error('send error data failed');
        };
        xhr.send(JSON.stringify(errorData));
      },

      // 监控 JS 资源加载错误
      monitorResourceError: function() {
        window.addEventListener('error', function(event) {
          if (event && event.target && (event.target.tagName === 'SCRIPT')) {
            var errorData = {
              type: 'error',
              errorType: 'resourceError',
              url: event.target.src,
              message: 'resource load failed',
              stack: '',
              ua: navigator.userAgent,
              time: new Date().getTime()
            };
            this.sendErrorData(errorData);
          }
        }.bind(this), true);
      },

      // 监控 JS 脚本运行错误
      monitorScriptError: function() {
        window.onerror = function(message, source, lineno, colno, error) {
          var errorData = {
            type: 'error',
            errorType: 'scriptError',
            url: source,
            message: message,
            lineno: lineno,
            colno: colno,
            stack: error && error.stack ? error.stack : '',
            ua: navigator.userAgent,
            time: new Date().getTime()
          };
          this.sendErrorData(errorData);
          return true;
        }.bind(this);
      },

      // 监控未处理的 Promise 拒绝
      monitorUnhandledRejection: function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var errorData = {
            type: 'error',
            errorType: 'unhandledRejection',
            url: window.location.href,
            message: 'Unhandled Promise Rejection',
            stack: '',
            ua: navigator.userAgent,
            time: new Date().getTime()
          };
          if (reason) {
            if (reason instanceof Error) {
              // 如果 reason 是 Error 对象
              errorData.message = reason.message || errorData.message;
              errorData.stack = reason.stack || '';
            } else if (typeof reason === 'string') {
              // 如果 reason 是字符串
              errorData.message = reason;
            } else {
              // 如果 reason 是其他类型的对象
              try {
                errorData.message = JSON.stringify(reason);
              } catch (e) {
                errorData.message = 'Unhandled Promise Rejection (Reason could not be stringified)';
              }
            }
          }
          this.sendErrorData(errorData);
        }.bind(this));
      },

      isClassicScript: function(scriptNode) {
        return !scriptNode.type || scriptNode.type === 'text/javascript';
      },

      // 监控 JS 资源加载超时
      monitorResourceTimeout: function() {
        if (!window.MutationObserver) {
          return
        }

        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList') {
              var addedNodes = mutation.addedNodes;
              for (var i = 0; i < addedNodes.length; i++) {
                var node = addedNodes[i];
                if (node && node.tagName === 'SCRIPT' && node.src && this.isClassicScript(node)) {
                  this.checkResourceTimeout(node);
                }
              }
            }
          }.bind(this));
        }.bind(this));

        observer.observe(document, {
          childList: true,
          subtree: true
        });
      },

      checkResourceTimeout: function(scriptNode) {
        var timeoutId = setTimeout(function() {
          if (!scriptNode.loaded) {
            var errorData = {
              type: 'error',
              errorType: 'resourceTimeout',
              url: scriptNode.src,
              message: 'resource load timeout',
              stack: '',
              ua: navigator.userAgent,
              time: new Date().getTime()
            };
            this.sendErrorData(errorData);
          }
        }.bind(this), 5000);

        scriptNode.addEventListener('load', function() {
          scriptNode.loaded = true;
          clearTimeout(timeoutId);
        });

        scriptNode.addEventListener('error', function() {
          clearTimeout(timeoutId);
        });
      }
    };

    window.ErrorMonitor = ErrorMonitor;
    // 初始化错误监控
    ErrorMonitor.init();
    ErrorMonitor.sendErrorData({
      type: 'visit',
      errorType: 'visitPage',
      url: window.location.href,
      message: '',
      stack: '',
      ua: navigator.userAgent,
      time: new Date().getTime()
    });
  })();
